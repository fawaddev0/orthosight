services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  rag:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /models
      RAG_COLLECTION_VERSION: ${RAG_COLLECTION_VERSION:-v1}
    volumes:
      - ${RAG_BOOKS_DIR:-./src/rag/test_books}:/app/books:ro
      - processed_data:/app/processed
      - model_cache:/models

volumes:
  qdrant_data:
  processed_data:
  model_cache:
