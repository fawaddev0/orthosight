[project]
name = "orthosight-backend"
version = "0.1.0"
requires-python = ">=3.15.2,<3.16"
dependencies = [
    "fastapi>=0.120,<1",
    "pydantic>=2,<3",
    "pymupdf>=1.28.2,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<3",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py315"
